name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Create app role and databases
        run: psql -h localhost -U postgres -f ../infra/postgres-init.sql
        env:
          PGPASSWORD: postgres

      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/datafog_test
          REDIS_URL: redis://localhost:6379
          DEMO_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
