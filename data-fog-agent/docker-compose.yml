services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    env_file: .env
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --reload"
    environment:
      # Lets scripts outside /app, like /demo/generate.py, import the app package.
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./demo:/demo
      - ./evals:/evals
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    env_file: .env
    command: uv run arq app.worker.WorkerSettings
    environment:
      PYTHONPATH: /app
    volumes:
      - ./backend:/app
      - ./demo:/demo
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      BACKEND_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
